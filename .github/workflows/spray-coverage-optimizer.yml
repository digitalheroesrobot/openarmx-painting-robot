name: Spray Coverage Optimizer Tests

on:
  push:
    paths:
      - "core/spray_coverage_optimizer.py"
      - "scripts/test_spray_coverage_optimizer.py"
      - "scripts/test_trajectory_safety.py"
      - "scripts/test_human_like_spray_planner.py"
      - "scripts/test_stage3_global_sweep.py"
      - "scripts/test_circular_spray_footprint.py"
      - "stages/trajectory_safety.py"
      - "stages/stage3_spray_trajectory.py"
      - "stages/human_like_spray_planner.py"
      - "stages/spray_footprint_optimizer.py"
      - "scripts/test_spray_footprint_optimizer.py"
      - "stages/spray_deposition_model.py"
      - "scripts/test_spray_deposition_model.py"
      - "stages/spray_coverage_path_planner.py"
      - "scripts/test_spray_coverage_path_planner.py"
      - "core/coating_deposition.py"
      - "core/coating_process.py"
      - "scripts/test_coating_process.py"
      - "tests/test_cone_deposition_geometry.py"
      - ".github/workflows/spray-coverage-optimizer.yml"
  pull_request:
    paths:
      - "core/spray_coverage_optimizer.py"
      - "scripts/test_spray_coverage_optimizer.py"
      - "scripts/test_trajectory_safety.py"
      - "scripts/test_human_like_spray_planner.py"
      - "stages/trajectory_safety.py"
      - "stages/stage3_spray_trajectory.py"
      - "stages/human_like_spray_planner.py"
      - "stages/spray_footprint_optimizer.py"
      - "scripts/test_spray_footprint_optimizer.py"
      - "stages/spray_deposition_model.py"
      - "scripts/test_spray_deposition_model.py"
      - "stages/spray_coverage_path_planner.py"
      - "scripts/test_spray_coverage_path_planner.py"
      - "core/coating_deposition.py"
      - "core/coating_process.py"
      - "scripts/test_coating_process.py"
      - "tests/test_cone_deposition_geometry.py"
      - ".github/workflows/spray-coverage-optimizer.yml"

jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy scipy trimesh pytest
      - name: Compile numerical modules and tests
        run: python -m compileall -q core stages scripts tests
      - name: Run coverage optimizer tests
        run: python scripts/test_spray_coverage_optimizer.py
      - name: Run trajectory safety tests
        run: python -m unittest scripts.test_trajectory_safety -v
      - name: Run human-like planner tests
        run: python -m unittest scripts.test_human_like_spray_planner -v
      - name: Run Stage 3 global sweep integration tests
        run: python -m unittest scripts.test_stage3_global_sweep -v
      - name: Run spray footprint optimizer tests
        run: python -m unittest scripts.test_spray_footprint_optimizer -v
      - name: Run spray deposition model tests
        run: python -m unittest scripts.test_spray_deposition_model -v
      - name: Run patch-local spray path planner tests
        run: python -m unittest scripts.test_spray_coverage_path_planner -v
      - name: Run circular spray footprint tests
        run: python -m unittest scripts.test_circular_spray_footprint -v
      - name: Run coating process tests
        run: python -m unittest scripts.test_coating_process -v
      - name: Run cone deposition geometry tests
        run: python -m pytest tests/test_cone_deposition_geometry.py -q
