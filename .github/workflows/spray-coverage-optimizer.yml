name: Spray Coverage Optimizer Tests

on:
  push:
    paths:
      - "core/spray_coverage_optimizer.py"
      - "scripts/test_spray_coverage_optimizer.py"
      - "ui/viewer_3d.py"
      - "app/main_window.py"
      - ".github/workflows/spray-coverage-optimizer.yml"
  pull_request:
    paths:
      - "core/spray_coverage_optimizer.py"
      - "scripts/test_spray_coverage_optimizer.py"
      - ".github/workflows/spray-coverage-optimizer.yml"

jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --upgrade numpy
      - name: Compile optimizer and GUI integration modules
        run: python -m compileall -q core/spray_coverage_optimizer.py ui/viewer_3d.py app/main_window.py scripts/test_spray_coverage_optimizer.py
      - name: Run coverage optimizer and integration tests
        run: python scripts/test_spray_coverage_optimizer.py
