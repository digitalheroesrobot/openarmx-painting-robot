name: Fast Application Syntax Check

on:
  push:
    paths:
      - "app/**/*.py"
      - "ui/**/*.py"
      - ".github/workflows/fast-application-syntax.yml"
  pull_request:
    paths:
      - "app/**/*.py"
      - "ui/**/*.py"
      - ".github/workflows/fast-application-syntax.yml"

concurrency:
  group: fast-application-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application modules
        run: python -m compileall -q app ui
